# Refer to https://wiki.hyprland.org/Configuring/Variables/

# Neon cyber palette (green-forward)
$activeBorderColor = rgba(00ff9cff) rgba(00e5ffff) 35deg
$inactiveBorderColor = rgba(1b3a34cc)

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 14

    border_size = 2

    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 26
        render_power = 3
        color = rgba(001a12aa)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        special = true
        brightness = 0.9
        contrast = 1.0
        noise = 0.02
    }
}

# https://wiki.hypr.land/Configuring/Variables/#group
group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = -1
    col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = JetBrainsMono Nerd Font
        font_weight_active = bold
        font_weight_inactive = normal

        indicator_height = 2
        indicator_gap = 5
        height = 24
        gaps_in = 6
        gaps_out = 0

        text_color = rgb(b8ffe4)
        text_color_inactive = rgba(b8ffe490)
        col.active = rgba(07261dcc)
        col.inactive = rgba(03110daa)

        gradients = true
        gradient_rounding = 8
        gradient_round_only_edges = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = quick,0.15,0,0.1,1

    animation = border, 1, 5, easeOutQuint
    animation = windows, 1, 5, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 85%
    animation = windowsOut, 1, 2, linear, popin 85%
    animation = fade, 1, 3, quick
    animation = layers, 1, 4, easeOutQuint
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    anr_missed_pings = 3
}

cursor {
    hide_on_key_press = true
}

env = GUM_CONFIRM_PROMPT_FOREGROUND,10
env = GUM_CONFIRM_SELECTED_FOREGROUND,0
env = GUM_CONFIRM_SELECTED_BACKGROUND,2
env = GUM_CONFIRM_UNSELECTED_FOREGROUND,0
env = GUM_CONFIRM_UNSELECTED_BACKGROUND,8
