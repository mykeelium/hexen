source = ~/.config/hexen/theme/hyprlock.conf
general {
    hide_cursor = true
}
background {
    monitor =
    color = $hexen_lock_background
}
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outer_color = $hexen_lock_primary
    inner_color = $hexen_lock_surface
    font_color = $hexen_lock_foreground
    placeholder_text = Enter password
    position = 0, 0
    halign = center
    valign = center
}
