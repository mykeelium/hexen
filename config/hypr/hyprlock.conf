# Hyprlock configuration
# Neon cyber green styling
$color = rgb(06120e)
$inner_color = rgba(0b1e18cc)
$outer_color = rgba(00ff9cee)
$font_color = rgb(b8ffe4)
$check_color = rgba(8dff63ee)
$fail_color = rgba(ff5c7aee)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 3
}

animations {
    enabled = false
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $font_color
    font_size = 86
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(b8ffe4cc)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 460, 56
    position = 0, -80
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter password
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 12
    shadow_passes = 2
    shadow_color = rgba(001a12aa)
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
