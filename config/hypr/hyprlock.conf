source = ~/.config/hexen/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $hexen_lock_background
}

label {
    monitor =
    text = H E X E N
    color = $hexen_lock_primary
    font_size = 38
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 205
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $hexen_lock_foreground
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

label {
    monitor =
    text = Session locked · $USER
    color = $hexen_lock_foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 64
    outline_thickness = 2
    rounding = 14
    outer_color = $hexen_lock_primary
    inner_color = $hexen_lock_surface
    font_color = $hexen_lock_foreground
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = Enter your password
    fail_text = Unlock failed — try again
    position = 0, -45
    halign = center
    valign = center
}
