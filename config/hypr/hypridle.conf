general {
    lock_cmd = "$HOME/.local/bin/hexen-screensaver" stop; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
# Renderer handles activity directly: mapping a terminal can resume idle listeners.
listener {
    timeout = 150
    on-timeout = "$HOME/.local/bin/hexen-screensaver" start --idle
}
listener {
    timeout = 300
    # A mapped lock screen resets idle; the next five-minute boundary powers off.
    on-timeout = "$HOME/.local/bin/hexen-screensaver" idle-action
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
