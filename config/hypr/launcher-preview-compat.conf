# Temporary launcher overlay for the host's existing Hyprland 0.55/Omarchy
# config. The full Hexen Hyprland config requires 0.56+ and is not loaded here.
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Hexen app launcher, exec, ~/.local/bin/hexen-desktop launcher

unbind = SUPER, ESCAPE
bindd = SUPER, ESCAPE, Hexen system menu, exec, ~/.local/bin/hexen-desktop system-menu

# Walker's app list is provided by Elephant.
exec-once = systemctl --user start hexen-elephant.service
