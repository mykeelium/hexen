# This file is a syntax reference; provision the machine-specific UUID through Ansible.
timeout: 5
default_entry: 1

/+Arch Linux
    protocol: linux
    path: boot():/vmlinuz-linux
    module_path: boot():/initramfs-linux.img
    cmdline: cryptdevice=UUID=REPLACE_WITH_LUKS_UUID:cryptroot root=/dev/mapper/cryptroot rootfstype=btrfs rootflags=subvol=@ rw
