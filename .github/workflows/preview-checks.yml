name: Installer preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check onboarding behavior without OS mutations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -p test_archinstall_generator.py
          python3 -m unittest discover -s tests -p test_first_boot.py
          python3 -m unittest discover -s tests -p test_walker_setup.py
          python3 -m unittest discover -s tests -p test_browser_fallback.py
          python3 -m unittest discover -s tests -p test_desktop_helper.py
          python3 -m unittest discover -s tests -p test_monitor_helper.py
          bash -n install/first-boot.sh install/provision.sh install/archinstall/hexen-install.sh config/bin/hexen-desktop
          git diff --check

  arch-interactive:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed git python util-linux shadow
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise interactive wrappers as a regular Arch user
        run: |
          useradd -m hexenci
          runuser -u hexenci -- bash -c 'test -f /etc/arch-release && test "$(id -u)" -ne 0 && command -v script'
          runuser -u hexenci -- env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p test_first_boot.py
          runuser -u hexenci -- env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p test_provision_cli.py
